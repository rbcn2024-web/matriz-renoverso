<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RENOVERSO v21 - Matriz Definitiva y Pincel Oculus</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <script>
      // SISTEMA DE PINTADO OCULUS (Puntos fijos Cyan al pulsar GATILLO)
      AFRAME.registerComponent('pincel-renoverso-oculus', {
        init: function () {
          // 'triggerdown' es el evento del gatillo de las Quest
          this.el.addEventListener('triggerdown', (evt) => {
            // Donde apunte el puntero del mando
            let cursor = this.el.sceneEl.querySelector('a-cursor');
            if (cursor && cursor.components.raycaster.intersections[0]) {
                let inter = cursor.components.raycaster.intersections[0];
                let punto = document.createElement('a-sphere');
                punto.setAttribute('position', inter.point);
                punto.setAttribute('radius', '0.03');
                punto.setAttribute('color', '#00FFFF'); // Cyan neón
                this.el.sceneEl.appendChild(punto);
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #87CEEB" cursor="rayOrigin: mouse" raycaster="objects: .pintable, a-plane, a-entity">
      
      <a-assets timeout="3000">
        <img id="mi-letrero" src="letrero.jpg">
      </a-assets>

      <a-plane class="pintable" position="0 0 0" rotation="-90 0 0" width="100" height="100" 
               color="#4682B4" material="metalness: 0.6; roughness: 0.4"></a-plane>
      
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.7; position: 1 4 2"></a-entity>

      <a-entity id="robot-guia" position="0 1.6 -4" animation="property: position; dir: alternate; dur: 2500; loop: true; to: 0 1.75 -4">
        <a-sphere radius="0.2" color="#fff" material="opacity: 0.9; transparent: true"></a-sphere>
        <a-plane width="0.06" height="0.005" color="#222" position="0.08 0.11 0.17"></a-plane>
        <a-plane width="0.06" height="0.005" color="#222" position="-0.08 0.11 0.17"></a-plane>
        <a-sphere radius="0.04" color="#222" position="0.08 0.03 0.16"></a-sphere>
        <a-sphere radius="0.04" color="#222" position="-0.08 0.03 0.16"></a-sphere>
        
        <a-cone radius-bottom="0.18" radius-top="0.001" height="0.6" color="#fff" material="opacity: 0.6; transparent: true" position="0 -0.4 0" rotation="180 0 0"></a-cone>
        <a-cone radius-bottom="0.03" radius-top="0.001" height="0.12" color="#fff" position="0.22 -0.15 0" rotation="160 0 0"></a-cone>
        <a-cone radius-bottom="0.03" radius-top="0.001" height="0.12" color="#fff" position="-0.22 -0.15 0" rotation="160 0 0"></a-cone>
      </a-entity>

      <a-image src="letrero.jpg" position="0 2.5 -8" width="4" height="2" material="shader: flat; transparent: true"></a-image>

      <a-entity position="6 0 -10">
        <a-torus radius="2.5" radius-tubular="0.08" arc="180" color="#00ff00" rotation="0 90 0"></a-torus>
        <a-circle radius="2.48" color="#00ff00" material="opacity: 0.2; transparent: true; side: double" rotation="0 90 0" class="clickable" onclick="window.location.href='https://tu-enlace-next.com'"></a-circle>
        <a-entity look-at="#rig" position="0 2.8 0">
           <a-text value="SIGUIENTE MUNDO" align="center" width="6" color="#222"></a-text>
        </a-entity>
      </a-entity>

      <a-entity position="-6 0 -10">
        <a-torus radius="2.5" radius-tubular="0.08" arc="180" color="#ff0000" rotation="0 90 0"></a-torus>
        <a-circle radius="2.48" color="#ff0000" material="opacity: 0.2; transparent: true; side: double" rotation="0 90 0" class="clickable" onclick="window.location.href='https://tu-enlace-prev.com'"></a-circle>
        <a-entity look-at="#rig" position="0 2.8 0">
           <a-text value="ANTERIOR MUNDO" align="center" width="6" color="#222"></a-text>
        </a-entity>
      </a-entity>

      <a-entity id="rig" movement-controls="fly: true; speed: 0.2; controls: keyboard, touch, gamepad">
        <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 65">
          <a-cursor color="#222"></a-cursor>
        </a-entity>
        <a-entity oculus-touch-controls="hand: left" pincel-renoverso-oculus></a-entity>
        <a-entity oculus-touch-controls="hand: right" pincel-renoverso-oculus></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
