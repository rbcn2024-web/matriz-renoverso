<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RENOVERSO Master v17 - Movimiento Total</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <script>
      // PISTOLA DE PINTURA
      AFRAME.registerComponent('pistola-pintura', {
        init: function () {
          window.addEventListener('click', () => {
            let p = document.createElement('a-sphere');
            let camPos = new THREE.Vector3();
            this.el.object3D.getWorldPosition(camPos);
            let direction = new THREE.Vector3(0, 0, -1).applyQuaternion(this.el.object3D.quaternion);
            p.setAttribute('position', camPos);
            p.setAttribute('radius', '0.02');
            p.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
            p.setAttribute('animation', {
              property: 'position',
              to: `${camPos.x + direction.x * 12} ${camPos.y + direction.y * 12} ${camPos.z + direction.z * 12}`,
              dur: 1500
            });
            this.el.sceneEl.appendChild(p);
            setTimeout(() => { if(p.parentNode) p.parentNode.removeChild(p); }, 1500);
          });
        }
      });

      // PROPULSIÓN DEL BOT
      AFRAME.registerComponent('propulsion-bot', {
        init: function () { this.tick = AFRAME.utils.throttleTick(this.tick, 100, this); },
        tick: function () {
          let scene = this.el.sceneEl;
          let p = document.createElement('a-sphere');
          let pos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(pos);
          p.setAttribute('position', pos);
          p.setAttribute('radius', '0.04');
          p.setAttribute('color', '#444');
          p.setAttribute('opacity', '0.6');
          p.setAttribute('animation', { property: 'position', to: `${pos.x} ${pos.y - 0.7} ${pos.z}`, dur: 1000 });
          scene.appendChild(p);
          setTimeout(() => { if(p.parentNode) scene.removeChild(p); }, 1000);
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #87CEEB">
      <a-assets>
        <a-asset-item id="mundo1" src="URL_GLB_1.glb"></a-asset-item>
        <a-asset-item id="mundo2" src="URL_GLB_2.glb"></a-asset-item>
        <a-asset-item id="mundo3" src="URL_GLB_3.glb"></a-asset-item>
        <a-asset-item id="mundo4" src="URL_GLB_4.glb"></a-asset-item>
      </a-assets>

      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#4682B4" material="metalness: 0.7; roughness: 0.2"></a-plane>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; position: 1 4 3"></a-entity>

      <a-entity id="robot-guia" position="0 1.6 -3" look-at="#rig" animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 1.7 -3">
        <a-sphere radius="0.2" color="#fff" material="opacity: 0.9; transparent: true"></a-sphere>
        <a-plane width="0.06" height="0.005" color="#222" position="0.08 0.12 0.17"></a-plane>
        <a-plane width="0.06" height="0.005" color="#222" position="-0.08 0.12 0.17"></a-plane>
        <a-sphere radius="0.04" color="#222" position="0.08 0.04 0.16"></a-sphere>
        <a-sphere radius="0.04" color="#222" position="-0.08 0.04 0.16"></a-sphere>
        <a-cone radius-bottom="0.18" radius-top="0.001" height="0.6" color="#fff" material="opacity: 0.5; transparent: true" position="0 -0.4 0" rotation="180 0 0"></a-cone>
        <a-cone radius-bottom="0.03" radius-top="0.001" height="0.12" color="#fff" position="0.22 -0.15 0" rotation="160 0 0"></a-cone>
        <a-cone radius-bottom="0.03" radius-top="0.001" height="0.12" color="#fff" position="-0.22 -0.15 0" rotation="160 0 0"></a-cone>
        <a-entity position="0 -0.65 0" propulsion-bot>
           <a-torus radius="0.04" radius-tubular="0.005" color="#222" rotation="90 0 0"></a-torus>
        </a-entity>
        <a-entity position="0 0.7 0">
           <a-plane width="1.3" height="0.12" color="#222" material="opacity: 0.8"><a-text value="P.K. DICK: 'La realidad no desaparece.'" align="center" width="1.2"></a-text></a-plane>
           <a-plane position="0 -0.15 0" width="1.3" height="0.12" color="#fff"><a-text value="ESCRIBE AQUÍ..." align="center" color="#222" width="1.2"></a-text></a-plane>
        </a-entity>
      </a-entity>

      <a-entity position="5 0 -6" onclick="window.location.href='https://tusitio.com/next'">
        <a-torus radius="1.2" radius-tubular="0.05" arc="180" color="#00ff00" rotation="0 90 0"></a-torus>
        <a-circle radius="1.18" color="#00ff00" material="opacity: 0.3; transparent: true; side: double" rotation="0 90 0"></a-circle>
        <a-entity light="type: point; color: #00ff00; intensity: 0.5" animation="property: intensity; to: 1; dir: alternate; dur: 500; loop: true"></a-entity>
      </a-entity>

      <a-entity position="-5 0 -6" onclick="window.location.href='https://tusitio.com/prev'">
        <a-torus radius="1.2" radius-tubular="0.05" arc="180" color="#ff0000" rotation="0 90 0"></a-torus>
        <a-circle radius="1.18" color="#ff0000" material="opacity: 0.3; transparent: true; side: double" rotation="0 90 0"></a-circle>
        <a-entity light="type: point; color: #ff0000; intensity: 0.5" animation="property: intensity; to: 1; dir: alternate; dur: 500; loop: true"></a-entity>
      </a-entity>

      <a-entity gltf-model="#mundo1" position="-10 0 -15"></a-entity>
      <a-entity gltf-model="#mundo2" position="10 0 -15"></a-entity>
      <a-entity gltf-model="#mundo3" position="-15 0 5"></a-entity>
      <a-entity gltf-model="#mundo4" position="15 0 5"></a-entity>

      <a-entity id="rig" movement-controls="fly: true; speed: 0.2; controls: keyboard, touch, gamepad">
        <a-entity camera position="0 1.6 0" 
                  look-controls="pointerLockEnabled: false; touchEnabled: true" 
                  wasd-controls="acceleration: 65"
                  pistola-pintura>
          <a-cursor color="#222"></a-cursor>
        </a-entity>
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
